# CSE644 Assignment 02, Requirement 6: Secret handling.
# DUMMY value only - not a real credential, safe to commit. Demonstrates the
# mechanics of injecting a Secret as an env var; app.py only ever reports
# whether it is present (`secret_loaded: true/false`), never its value.
#
# Kubernetes Secrets are base64-ENCODED, not encrypted, in etcd by default -
# see README "Secrets: what Kubernetes does and does not protect" for the
# production mitigations (encryption at rest, least-privilege RBAC).
apiVersion: v1
kind: Secret
metadata:
  name: python-web-secret
  namespace: cse644
type: Opaque
stringData:
  APP_SECRET_VALUE: "dummy-api-key-DO-NOT-USE-93f7c2a1"
