# CSE644 Assignment 02, Requirement 4 (NodePort).
# Opens a fixed port (30080) on EVERY cluster node. The KinD cluster config
# (kind/kind-config.yaml) maps host port 30080 -> the control-plane node's
# port 30080, which is what makes this reachable from outside the cluster
# at all on a local KinD setup.
apiVersion: v1
kind: Service
metadata:
  name: nginx-web-nodeport
  namespace: cse644
  labels:
    app: nginx-web
spec:
  type: NodePort
  selector:
    app: nginx-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
