# =============================================================================
# CSE644 Cloud Computing - Assignment 02, Requirement 3
# HAProxy as an independent edge component in front of the customized Nginx
# web application.
#
# The backend below has exactly ONE server line, and it points at the
# Kubernetes Service's stable DNS name (nginx-web-svc.cse644.svc.cluster.local)
# rather than at an individual Pod IP or container name. Kubernetes' own
# kube-proxy already load-balances across whatever Nginx Pod replicas are
# currently Ready behind that Service - HAProxy is proxying THROUGH service
# discovery, not maintaining its own list of backend Pod addresses. Pods can
# be replaced, rescheduled, or scaled up/down and this config never changes.
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    # No `user`/`group` here - the official haproxy image already starts the
    # process as the unprivileged `haproxy` user.

defaults
    mode    http
    log     global
    option  httplog
    option  forwardfor
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

# ---------------------------------------------------------------- frontend --
frontend fe_http
    bind *:80

    # Headers that make the proxy hop visible from the client side - seeing
    # these in a curl response proves the request went THROUGH HAProxy.
    http-response set-header X-CSE644-Proxy        "haproxy"
    http-response set-header X-CSE644-Proxy-Node   "%[env(HOSTNAME)]"
    http-request  set-header X-CSE644-Forwarded-By "haproxy"

    default_backend be_nginx_svc

# ----------------------------------------------------------------- backend --
backend be_nginx_svc
    # A ClusterIP Service's DNS name resolves to a single stable virtual IP
    # (not a Pod IP), so there is nothing to "balance" here on HAProxy's side
    # - Kubernetes already spreads the actual traffic across Pod replicas.
    balance roundrobin

    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200

    # init-addr last,libc,none: HAProxy resolves this hostname when it PARSES
    # the config. At `docker build` time there is no cluster DNS, so the name
    # cannot resolve yet - this tells HAProxy to start anyway (marked down)
    # instead of refusing to boot, and to re-resolve once it is actually
    # running inside the cluster.
    server nginx-web nginx-web-svc.cse644.svc.cluster.local:80 \
        check inter 2s fall 2 rise 2 init-addr last,libc,none resolvers dns_resolver

# --------------------------------------------------------------- resolver ---
# CoreDNS inside the cluster, used to re-resolve the Service name at runtime
# (not just once at process start) so HAProxy notices if the Service's
# ClusterIP ever changes (e.g. Service recreated).
resolvers dns_resolver
    nameserver dns1 10.96.0.10:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# ------------------------------------------------------------ stats page ----
frontend fe_stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
