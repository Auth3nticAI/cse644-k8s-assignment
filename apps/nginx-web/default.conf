# Replaces the stock /etc/nginx/conf.d/default.conf from the nginx base image.
# Customizing server config (not just the HTML) is what makes this a genuinely
# customized image rather than a file drop.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # $hostname resolves to the container's hostname, which in Kubernetes is
    # the Pod name. That's what proves "reached different backend instances"
    # when curling a Service (or HAProxy in front of it) repeatedly.
    add_header X-CSE644-Served-By $hostname always;
    add_header X-CSE644-Course    "CSE644 Cloud Computing" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight endpoint used for the Kubernetes readiness/liveness probes
    # and for HAProxy's backend health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
